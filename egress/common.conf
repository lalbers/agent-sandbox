# Shared egress policy, included first by api.conf and open.conf.
# The sandbox subnet must match SUBNET in bin/sbx.

http_port 3128
pid_filename /tmp/squid.pid
coredump_dir /tmp
cache deny all
cache_mem 0 MB
logfile_rotate 0
cache_log /dev/stderr
logformat sbx EGRESS %{%Y-%m-%dT%H:%M:%S}tl %Ss/%03>Hs %rm %ru
access_log stdio:/dev/stdout sbx
via off
forwarded_for delete
httpd_suppress_version_string on
shutdown_lifetime 1 seconds

acl sbx_clients src 10.213.77.0/24
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

# Never forward to private, loopback, link-local (incl. cloud metadata),
# carrier-grade NAT, benchmark, multicast, reserved or NAT64 addresses.
# A `dst` ACL resolves the requested name, so the mode files only check it
# after every rule that can refuse a request without DNS.
acl blocked_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16
acl blocked_dst dst 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15
acl blocked_dst dst 224.0.0.0/4 240.0.0.0/4
# IPv6: IPv4-compatible (::/96), both NAT64 prefixes, 6to4 and Teredo (they
# embed an IPv4 address), discard-only and documentation, ULA, link-local and
# multicast. IPv4-mapped addresses (::ffff:0:0/96) are not listed: squid
# matches them as IPv4 against the rules above. sbx selftest checks both.
acl blocked_dst dst ::/96 64:ff9b::/96 64:ff9b:1::/48 100::/64 2001::/32
acl blocked_dst dst 2001:db8::/32 2002::/16 fc00::/7 fe80::/10 ff00::/8

http_access deny !sbx_clients
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
