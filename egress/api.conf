# Mode "api": only the hosts listed in allow-api.txt.
include /etc/squid/sbx/common.conf

# Refuse everything else before any rule that needs DNS: a lookup alone would
# carry data to the nameserver of the requested name. -n: an IP literal never
# matches through its reverse DNS name.
acl api_hosts dstdomain -n "/etc/squid/sbx/allow-api.txt"
http_access deny !api_hosts
http_access deny blocked_dst
http_access allow api_hosts
http_access deny all
